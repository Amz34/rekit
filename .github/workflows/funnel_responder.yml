name: Community Funnel & Contributor Gate
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-respond:
    runs-on: ubuntu-latest
    steps:
      - name: Respond to contributor
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const author = context.actor;
            const message = isPR 
              ? `👋 Thanks for the contribution @${author}! Our automated read-only CI pipeline is testing this pull request. In the meantime, verify your additions conform to our [Zero-Detonation Guarantees](https://amz34.github.io/rekit/architecture/guarantees/).`
              : `Thanks for opening this issue @${author}! 🛡️\n\nIf you're proposing a new static analysis backend or subtool, ensure it abides by \`rekit\`'s strict read-only constraints. You can review the [MCP Tool Schema & Guidelines](https://amz34.github.io/rekit/mcp/tools/).`;
            
            if (isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: message
              });
            }
